version: '3'

services: 
  db:
    restart: always
    image: postgres:18-alpine
    container_name: pg-db
    command: ["-c", "shared_buffers=256MB", "-c", "max_connections=500"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-database.sh:/docker-entrypoint-initdb.d/init-database.sh
    environment:
      - POSTGRES_PASSWORD=pg@2026
    ports:
      - 5432:5432
    env_file:
      - .env
    expose:
      - 5432
    networks:
      - app-network
   
  redis:
    image: redis:latest
    container_name: redis-db
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - /path/to/local/dаta:/root/redis
      - /path/to/local/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=pg@2026
      - REDIS_PORT=6379
      - REDIS_DATABASES=0
    
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: pg@2026
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI  →  http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5 
  
  
  adminer:
    image: adminer
    container_name: pg-adminer
    restart: always
    depends_on:
      - db
    ports:
      - 8080:8080
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@ictech-drc.com"
      PGADMIN_DEFAULT_PASSWORD: "pg@2026"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro
    depends_on:
      - db
    networks:
      - app-network

volumes:
  postgres:
    driver: local
  pgadmin_data:
    driver: local
  rabbitmq_data:
    driver: local

    
networks:
  app-network:
    driver: bridge

    